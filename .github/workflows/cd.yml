name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: storygen-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy StoryGen to GCP
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/728996975586/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: storygen-deployer@storygen-devops.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Pull latest production code
        run: |
          gcloud compute ssh instance-20261005-083623 \
            --zone=us-central1-a \
            --tunnel-through-iap \
            --quiet \
            --command="sudo -iu isumanmitha bash -lc 'cd /home/isumanmitha/storyGen && git pull --ff-only origin main'"

      - name: Refresh runtime secrets
        run: |
          gcloud compute ssh instance-20261005-083623 \
            --zone=us-central1-a \
            --tunnel-through-iap \
            --quiet \
            --command="sudo -iu isumanmitha /home/isumanmitha/bin/refresh-storygen-secrets.sh"

      - name: Build and restart application
        run: |
          gcloud compute ssh instance-20261005-083623 \
            --zone=us-central1-a \
            --tunnel-through-iap \
            --quiet \
            --command="sudo -iu isumanmitha bash -lc 'cd /home/isumanmitha/storyGen && docker compose --env-file /etc/storygen/storygen.env up -d --build --force-recreate'"

      - name: Wait for backend health
        run: |
          gcloud compute ssh instance-20261005-083623 \
            --zone=us-central1-a \
            --tunnel-through-iap \
            --quiet \
            --command="sudo -iu isumanmitha bash -lc 'cd /home/isumanmitha/storyGen && for i in {1..12}; do STATUS=\$(docker inspect --format=\"{{.State.Health.Status}}\" storygen-backend 2>/dev/null || true); echo \"Backend health: \$STATUS\"; if [ \"\$STATUS\" = \"healthy\" ]; then exit 0; fi; sleep 5; done; echo \"Backend failed to become healthy within 60 seconds\"; docker compose --env-file /etc/storygen/storygen.env logs --tail=80 backend; exit 1'"

      - name: Verify deployment
        run: |
          gcloud compute ssh instance-20261005-083623 \
            --zone=us-central1-a \
            --tunnel-through-iap \
            --quiet \
            --command="sudo -iu isumanmitha bash -lc 'cd /home/isumanmitha/storyGen && docker compose --env-file /etc/storygen/storygen.env ps'"