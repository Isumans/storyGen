services:
  db:
    image: postgres:18
    restart: unless-stopped
    container_name: storygen-db

    environment:
      POSTGRES_DB: storygen
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storygen -d storygen"]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    container_name: storygen-backend

    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/storygen
      API_PREFIX: /api
      DEBUG: "false"
      ALLOWED_ORIGINS: http://localhost:5173

      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GROQ_MAX_TOKENS: ${GROQ_MAX_TOKENS:-4096}

    healthcheck:
      test: ["CMD","python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    container_name: storygen-frontend

    ports:
      - "80:80"

    depends_on:
      - backend

volumes:
  postgres_data:
